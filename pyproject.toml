[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techtide-botkit"
version = "0.4.3"
description = "An agent loop in a few lines, plus optional tools, skills, memory (SQLite/Supabase/your own), MCP and multi-agent workflows (sequential, parallel, custom graphs)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
docs = ["python-docx", "python-pptx", "openpyxl", "reportlab"]
mcp = ["mcp>=1.2"]
all = ["python-docx", "python-pptx", "openpyxl", "reportlab", "mcp>=1.2"]
dev = ["pytest", "python-docx", "python-pptx", "openpyxl", "reportlab", "mcp>=1.2"]

[project.scripts]
botkit = "botkit.cli:main"

[tool.setuptools.packages.find]
include = ["botkit*"]

[tool.setuptools.package-data]
botkit = ["skills/*/SKILL.md"]
