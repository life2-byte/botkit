<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botkit Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        #chat { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
        .user { background: #dcf8c6; margin-left: auto; text-align: right; }
        .bot { background: #fff; border: 1px solid #ddd; }
        #input-area { display: flex; gap: 8px; }
        #msg-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        #send-btn { padding: 10px 20px; cursor: pointer; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>Botkit Test Chat</h2>
    <div id="chat"></div>
    <div id="input-area">
        <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('msg-input');
        const btn = document.getElementById('send-btn');

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMsg(text, 'user');
            btn.disabled = true;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (!res.ok) throw new Error('Server error');
                const data = await res.json();
                addMsg(data.reply, 'bot');
            } catch (e) {
                addMsg('Error: ' + e.message, 'bot');
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        btn.addEventListener('click', send);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
