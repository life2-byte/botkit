<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="botkit: an agent loop in a few lines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#161a3a"/>
      <stop offset="1" stop-color="#1f1147"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="22" fill="url(#glow1)"/>
  <rect width="1280" height="360" rx="22" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- left: name and promise -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g transform="translate(70,92)">
      <rect width="54" height="54" rx="14" fill="#6366f1"/>
      <rect x="13" y="16" width="28" height="22" rx="6" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="21" cy="27" r="3" fill="#fff"/><circle cx="33" cy="27" r="3" fill="#fff"/>
      <path d="M27 16 V9" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="8" r="2.6" fill="#fff"/>
    </g>
    <text x="142" y="140" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1.5">botkit</text>
    <text x="70" y="206" font-size="27" font-weight="600" fill="#e2e8f0">An AI agent in a few lines of Python.</text>
    <text x="70" y="244" font-size="18" fill="#94a3b8">Start with just the loop. Switch on tools, skills, memory, MCP</text>
    <text x="70" y="270" font-size="18" fill="#94a3b8">and multi-agent workflows only when you need them.</text>

    <g transform="translate(70,296)" font-size="14" font-weight="600">
      <rect width="112" height="30" rx="15" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="56" y="20" text-anchor="middle" fill="#c7d2fe">pip install</text>
      <rect x="124" width="214" height="30" rx="15" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="231" y="20" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, 'SF Mono', Menlo, monospace">techtide-botkit</text>
    </g>
  </g>

  <!-- right: the team loop -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="900" y="62" text-anchor="middle" font-size="13" fill="#94a3b8" letter-spacing="3">PLANNER · WORKER · REVIEWER</text>

    <g transform="translate(700,100)">
      <rect width="150" height="64" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
      <text x="75" y="30" text-anchor="middle" font-size="18" fill="#e0e7ff">Planner</text>
      <text x="75" y="49" text-anchor="middle" font-size="12" font-weight="500" fill="#a5b4fc">makes the plan</text>
    </g>
    <g transform="translate(900,100)">
      <rect width="150" height="64" rx="14" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="75" y="30" text-anchor="middle" font-size="18" fill="#cffafe">Worker</text>
      <text x="75" y="49" text-anchor="middle" font-size="12" font-weight="500" fill="#67e8f9">uses tools, does it</text>
    </g>
    <g transform="translate(1050,236)">
      <rect x="-75" width="150" height="64" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <text x="0" y="30" text-anchor="middle" font-size="18" fill="#d1fae5">Reviewer</text>
      <text x="0" y="49" text-anchor="middle" font-size="12" font-weight="500" fill="#6ee7b7">runs and verifies</text>
    </g>

    <path d="M850 132 H896" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1050 164 Q1150 190 1100 232" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M975 268 H935 Q925 268 925 258 V170" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowAmber)"/>
    <text x="912" y="214" text-anchor="end" font-size="13" fill="#fbbf24" font-weight="600">changes needed:</text>
    <text x="912" y="232" text-anchor="end" font-size="13" fill="#fbbf24" font-weight="600">fix and retry</text>
    <g transform="translate(1135,206)">
      <rect width="86" height="26" rx="13" fill="#052e16" stroke="#34d399" stroke-opacity="0.7"/>
      <text x="43" y="18" text-anchor="middle" font-size="13" fill="#6ee7b7">APPROVED</text>
    </g>
  </g>
</svg>
